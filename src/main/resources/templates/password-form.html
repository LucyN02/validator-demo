<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Validador de Senha</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="center-wrapper">
    <div class="card">
        <h1>Validador de Senha</h1>

        <form th:action="@{/validators/password-validate}" th:object="${request}" method="post">
            <label for="value">Senha:</label>
            <input type="password" id="value" th:field="*{value}" />
            <div th:if="${#fields.hasErrors('value')}" class="field-error">
                <p th:errors="*{value}"></p>
            </div>
            <button type="submit">Validar</button>
        </form>

        <div th:if="${response != null}" class="result">
            <h2 th:text="${response.valid} ? 'Senha Válida' : 'Senha Inválida'"></h2>
            <ul>
                <li th:each="err : ${response.errors}" th:text="${err}"></li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
